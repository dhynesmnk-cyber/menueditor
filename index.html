<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu Studio</title>
<style>
  @font-face { font-family: 'MCrimson'; src: url('fonts/CrimsonText-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'MCrimson'; src: url('fonts/CrimsonText-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'MCrimson'; src: url('fonts/CrimsonText-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; }
  @font-face { font-family: 'MLato'; src: url('fonts/Lato-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'MLato'; src: url('fonts/Lato-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'MLato'; src: url('fonts/Lato-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; }

  :root {
    --chrome: #f2f5f9;
    --panel: #ffffff;
    --line: #dbe2ec;
    --text: #131a24;
    --dim: #667485;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--chrome); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 232px 1fr 268px; grid-template-rows: 46px 1fr;
    grid-template-areas: "top top top" "left stage right";
    overflow: hidden;
  }
  header {
    grid-area: top; display: flex; align-items: center; gap: 14px;
    padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .brand { font-weight: 600; letter-spacing: .02em; }
  header .brand span { color: var(--accent); }
  header .spacer { flex: 1; }
  .btn {
    background: #ffffff; color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  .btn:hover { background: #eef2f8; }
  .btn.primary { background: var(--accent); border-color: #1f5cd6; color: #ffffff; font-weight: 600; }
  .btn.primary:hover { background: #1f5cd6; }
  .badge { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  aside { background: var(--panel); overflow-y: auto; }
  aside.left { grid-area: left; border-right: 1px solid var(--line); }
  aside.right { grid-area: right; border-left: 1px solid var(--line); }
  .sec { padding: 12px; border-bottom: 1px solid var(--line); }
  .sec h2 {
    margin: 0 0 9px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); font-weight: 600;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
  .row label { flex: 1; color: var(--dim); font-size: 12px; }
  input[type=text], input[type=number], select, textarea {
    background: #ffffff; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 7px; font: inherit; width: 100%;
  }
  input[type=number] { width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid rgba(47,111,237,.22); outline-offset: 0; border-color: var(--accent);
  }
  input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; }
  textarea { resize: vertical; min-height: 56px; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .list button {
    text-align: left; background: none; border: 0; color: var(--text); padding: 5px 7px;
    border-radius: 5px; cursor: pointer; font: inherit; display: flex; gap: 7px; align-items: baseline;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .list button:hover { background: #f1f5fb; }
  .list button.sel { background: #e7eefe; box-shadow: inset 2px 0 0 var(--accent); }
  .list .tag { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); min-width: 44px; }

  main { grid-area: stage; position: relative; overflow: auto; display: grid; place-items: center; padding: 26px; }
  #sheet {
    position: relative; background: #fff; box-shadow: 0 18px 50px rgba(16,32,64,.16), 0 0 0 1px rgba(16,32,64,.10);
  }
  #bleed { position: absolute; inset: 0; pointer-events: none; }
  #trim { position: absolute; pointer-events: none; outline: 1px dashed rgba(47,111,237,.40); }
  #layer { position: absolute; inset: 0; }
  #layer .t {
    position: absolute; white-space: pre; transform-origin: 0 0;
    /* The PDF exporter places glyphs by raw font advance widths — no kerning
       lookups, no ligature substitution. Turn both off here so the screen
       agrees with the print to the fraction of a point instead of drifting
       a couple of points across the line. */
    font-kerning: none;
    font-variant-ligatures: none;
    font-feature-settings: "kern" 0, "liga" 0, "clig" 0, "dlig" 0, "calt" 0;
    text-rendering: geometricPrecision;
  }
  #layer .dots, #layer .rule { position: absolute; }
  #overlays { position: absolute; inset: 0; }
  .bound {
    position: absolute; cursor: grab; border: 1px solid transparent; border-radius: 2px;
  }
  .bound:hover { border-color: rgba(47,111,237,.55); }
  .bound.sel { border-color: var(--accent); background: rgba(47,111,237,.06); }
  .bound.sel::after {
    content: ''; position: absolute; left: -4px; top: -4px; width: 7px; height: 7px;
    background: var(--accent); border-radius: 50%;
  }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.5; }
  .warn { color: #b42318; }

  .modal { position: fixed; inset: 0; background: rgba(13,21,34,.45); display: none; place-items: center; z-index: 50; }
  .modal.open { display: grid; }
  .modal-card {
    width: min(980px, 94vw); height: min(780px, 90vh); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 30px 80px rgba(16,32,64,.22);
  }
  .modal-card h3 {
    margin: 0; padding: 13px 16px; font-size: 12px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line);
  }
  .modal-body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  #importText {
    border: 0; border-right: 1px solid var(--line); border-radius: 0; resize: none;
    height: 100%; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 14px; background: #f7f9fc; color: var(--text);
  }
  #importText:focus { outline: none; }
  .preview { overflow-y: auto; padding: 12px 14px; }
  .preview h4 {
    margin: 14px 0 6px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); font-weight: 600;
  }
  .prow { display: grid; grid-template-columns: 1fr 62px 54px; gap: 6px; margin-bottom: 4px; align-items: center; }
  .prow input { padding: 3px 6px; font-size: 12px; }
  .prow input[readonly] { background: transparent; color: var(--dim); border-color: transparent; }
  .summary { font-size: 12px; color: var(--text); padding: 2px 0 8px; }
  .warnline { font-size: 11px; line-height: 1.5; padding: 3px 0 3px 14px; position: relative; color: #b42318; }
  .warnline::before { content: '•'; position: absolute; left: 2px; }
  .warnline.error { color: #b42318; }
  .warnline.info { color: var(--dim); }
  .modal-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
  .modal-actions .spacer { flex: 1; }
</style>
</head>
<body>
  <header>
    <div class="brand">Menu <span>Studio</span></div>
    <div class="badge" id="status">spike: renderer + PDF</div>
    <div class="spacer"></div>
    <div class="badge" id="fit"></div>
    <button class="btn" id="zoomOut">−</button>
    <div class="badge" id="zoomLabel">100%</div>
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="importBtn">Import</button>
    <button class="btn" id="canvasBtn" title="Open a PDF and keep its own layout">Keep layout</button>
    <button class="btn primary" id="export">Export PDF</button>
  </header>
  <input type="file" id="canvasFile" accept="application/pdf,.pdf" hidden>

  <aside class="left">
    <div class="sec">
      <h2>Blocks</h2>
      <div class="list" id="blockList"></div>
    </div>
    <div class="sec">
      <h2>Page</h2>
      <div class="row"><label>Width</label><input type="number" id="pwIn" step="0.05"><span class="badge">in</span></div>
      <div class="row"><label>Width</label><input type="number" id="pwMm" step="1"><span class="badge">mm</span></div>
      <div class="row"><label>Height</label><input type="number" id="phIn" step="0.05"><span class="badge">in</span></div>
      <div class="row"><label>Height</label><input type="number" id="phMm" step="1"><span class="badge">mm</span></div>
      <div class="row"><label>Bleed</label><input type="number" id="bleedIn" step="0.0625"><span class="badge">in</span></div>
      <div class="row"><label>Crop marks</label><input type="checkbox" id="cropMarks" style="width:auto"></div>
      <div class="row"><label>Paper</label><input type="color" id="paper"></div>
      <div class="row"><label>Ink</label><input type="color" id="ink"></div>
      <div class="row"><label>Accent</label><input type="color" id="accentColor"></div>
    </div>
    <div class="sec">
      <h2>Presets</h2>
      <div class="list">
        <button data-preset="letter">Letter · 8.5 × 11</button>
        <button data-preset="a4">A4 · 210 × 297 mm</button>
        <button data-preset="half">Half letter · 5.5 × 8.5</button>
        <button data-preset="dl">Slim · 3.7 × 8.5</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="sheet">
      <img id="refImg" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;opacity:.28;mix-blend-mode:multiply">
      <div id="layer"></div>
      <div id="trim"></div>
      <div id="overlays"></div>
    </div>
  </main>

  <aside class="right">
    <div class="sec" id="inspector">
      <h2>Inspector</h2>
      <div class="hint">Select a block on the page.</div>
    </div>
    <div class="sec">
      <h2>Fidelity</h2>
      <div class="hint" id="fidelity"></div>
    </div>
  </aside>

<div class="modal" id="importModal">
  <div class="modal-card">
    <h3>Import menu text</h3>
    <div class="modal-body">
      <textarea id="importText" spellcheck="false"
        placeholder="Paste your menu here — sections, dishes, prices and descriptions.&#10;&#10;e.g.&#10;TO BEGIN&#10;Charred Sourdough ....... 9&#10;Cultured butter, smoked salt"></textarea>
      <div class="preview" id="importPreview">
        <div id="designPanel"></div>
        <div class="hint">Paste text on the left, then Parse. Nothing is applied to the canvas until you say so.</div>
      </div>
    </div>
    <div class="modal-actions" style="border-top:0;padding-bottom:0">
      <label class="btn" for="importFile">Upload PDF / PNG</label>
      <input type="file" id="importFile" accept=".pdf,.png,.jpg,.jpeg" hidden>
      <span class="hint" id="importFileName"></span>
      <div class="spacer"></div>
      <button class="btn" id="importExample">Load example</button>
    </div>
    <div class="modal-actions">
      <button class="btn" id="importCancel">Cancel</button>
      <div class="spacer"></div>
      <button class="btn" id="importParse">Parse</button>
      <button class="btn primary" id="importApply" disabled>Apply to canvas</button>
    </div>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="src/engine.js"></script>
<script src="src/menu-model.js"></script>
<script src="src/import.js"></script>
<script src="src/layout.js"></script>
<script src="src/design.js"></script>
<script src="src/planner.js"></script>
<script src="src/pdf.js"></script>
<script src="src/lines.js"></script>
<script src="src/canvas.js"></script>
<script>
const PT = 72;
const state = { menu: null, lay: null, sel: null, zoom: 1, zoomScale: 1 };

// ---- jsPDF-backed metrics (identical code path to node) -------------------
let metricsDoc = null;

function buildMetrics(fontDefs) {
  const doc = new jspdf.jsPDF({ unit: 'pt', format: [612, 792] });
  fontDefs.forEach(f => {
    doc.addFileToVFS(f.family + '-' + f.style + '.ttf', f.b64);
    doc.addFont(f.family + '-' + f.style + '.ttf', f.family, f.style);
  });
  metricsDoc = doc;
  return MenuEngine.createEngine({
    width(text, st) {
      metricsDoc.setFont(st.font, st.style || 'normal');
      metricsDoc.setFontSize(st.size);
      return metricsDoc.getTextWidth(text);
    }
  });
}

async function loadFonts() {
  const out = [];
  for (const f of MenuModel.FONTS) {
    const res = await fetch('fonts/' + f.file);
    const ab = await res.arrayBuffer();
    const buf = new Uint8Array(ab);
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < buf.length; i += CH) bin += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
    out.push({ family: f.family, style: f.style, file: f.file, b64: btoa(bin) });

    // seed the screen baseline model from the font's own metrics
    const st = styleTokens(f.style);
    ascCache.set(f.family + '|' + st.weight + '|' + st.slant, baselineRatioFromTTF(ab));
  }
  return out;
}

function styleTokens(style) {
  return {
    weight: String(style).includes('bold') ? 700 : 400,
    slant: String(style).includes('italic') ? 'italic' : 'normal'
  };
}

// ---- exact baseline placement for the screen -----------------------------
// Chrome puts a glyph's baseline at (1-(A+D))/2 + A em below the top of a
// line box of height 1em, where A/D are the font's ascent/descent. Read A and
// D straight out of the TTF (hhea, or OS/2 typo metrics when the font asks for
// them) — canvas fontBoundingBox does NOT report the same numbers, and being
// wrong here shifts every line on screen against the print.
function baselineRatioFromTTF(buf) {
  const dv = new DataView(buf);
  const numTables = dv.getUint16(4);
  let head = 0, hhea = 0, os2 = 0;
  for (let i = 0; i < numTables; i++) {
    const o = 12 + i * 16;
    const tag = String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
    const off = dv.getUint32(o + 8);
    if (tag === 'head') head = off;
    else if (tag === 'hhea') hhea = off;
    else if (tag === 'OS/2') os2 = off;
  }
  const upem = dv.getUint16(head + 18);
  let A = dv.getInt16(hhea + 4) / upem;
  let D = -dv.getInt16(hhea + 6) / upem;
  if (os2) {
    const fsSelection = dv.getUint16(os2 + 62);
    if (fsSelection & (1 << 7)) {              // USE_TYPO_METRICS
      A = dv.getInt16(os2 + 68) / upem;
      D = -dv.getInt16(os2 + 70) / upem;
    }
  }
  return (1 - (A + D)) / 2 + A;
}

const ascCache = new Map();
function ascentEm(family, weight, style) {
  const key = family + '|' + weight + '|' + style;
  if (ascCache.has(key)) return ascCache.get(key);
  // last-resort canvas estimate if the font file never loaded
  const ctx = document.createElement('canvas').getContext('2d');
  const px = 200;
  ctx.font = `${style} ${weight} ${px}px "${family}"`;
  const m = ctx.measureText('HxdpqgjQ');
  const A = (m.fontBoundingBoxAscent != null ? m.fontBoundingBoxAscent : px * 0.8) / px;
  const D = (m.fontBoundingBoxDescent != null ? m.fontBoundingBoxDescent : px * 0.2) / px;
  const ratio = (1 - (A + D)) / 2 + A;
  ascCache.set(key, ratio);
  return ratio;
}

function weightOf(style) { return String(style || '').includes('bold') ? 700 : 400; }
function slantOf(style) { return String(style || '').includes('italic') ? 'italic' : 'normal'; }

// Applies a display-list text run's typography to an element at scale s.
// Longhand properties only: the `font` shorthand would reset font-kerning and
// font-feature-settings back to their defaults, and those are exactly what has
// to stay off for the screen to agree with the PDF.
function applyTextStyle(el, e, s) {
  el.style.fontFamily = '"' + e.font + '"';
  el.style.fontSize = (e.size * s) + 'px';
  el.style.fontWeight = String(weightOf(e.style));
  el.style.fontStyle = slantOf(e.style);
  el.style.fontKerning = 'none';
  el.style.fontVariantLigatures = 'none';
  el.style.fontFeatureSettings = '"kern" 0, "liga" 0, "clig" 0, "dlig" 0, "calt" 0';
  el.style.textRendering = 'geometricPrecision';
  el.style.lineHeight = '1';
  el.style.letterSpacing = ((e.tracking || 0) * s) + 'px';
}

// ---- render --------------------------------------------------------------
let engine = null;
let fontDefs = [];

function relayout() {
  state.lay = engine.layout(state.menu);
  drawSheet();
  drawOverlays();
  drawList();
  drawFidelity();
}

// Coalesce relayouts that can fire faster than the screen refreshes (held arrow
// keys, dragging a slider). The layout pass is ~2ms; doing it 120 times a second
// for one keystroke is waste.
let relayoutTick = false;
function requestRelayout() {
  if (relayoutTick) return;
  relayoutTick = true;
  requestAnimationFrame(() => { relayoutTick = false; relayout(); });
}

function drawSheet() {
  const lay = state.lay, m = state.menu;
  const s = state.zoomScale;
  const bleedPx = (m.page.bleed || 0) * PT * s;
  const sheet = document.getElementById('sheet');
  sheet.style.width = (lay.page.w * s + bleedPx * 2) + 'px';
  sheet.style.height = (lay.page.h * s + bleedPx * 2) + 'px';
  sheet.style.background = m.theme.paper;

  document.getElementById('trim').style.cssText =
    'position:absolute;left:' + bleedPx + 'px;top:' + bleedPx + 'px;width:' +
    (lay.page.w * s) + 'px;height:' + (lay.page.h * s) + 'px;outline:' +
    (m.page.cropMarks ? '1px dashed rgba(200,118,63,.45)' : 'none');

  const layer = document.getElementById('layer');
  layer.style.cssText = 'position:absolute;left:' + bleedPx + 'px;top:' + bleedPx + 'px;width:' +
    (lay.page.w * s) + 'px;height:' + (lay.page.h * s) + 'px';
  layer.innerHTML = '';
  const textNodes = [];
  state.layZoom = s;

  lay.displayList.forEach(e => {
    if (e.k === 'text') {
      const d = document.createElement('div');
      d.className = 't';
      const w = weightOf(e.style), sl = slantOf(e.style);
      d.style.left = (e.x * s) + 'px';
      d.style.top = ((e.baseline - ascentEm(e.font, w, sl) * e.size) * s) + 'px';
      applyTextStyle(d, e, s);
      d.style.color = e.color;
      d.textContent = e.t;
      layer.appendChild(d);
      textNodes.push({ e, el: d });
    } else if (e.k === 'dots') {
      const d = document.createElement('div');
      d.className = 'dots';
      const r = e.r * s;
      d.style.left = (e.x1 * s) + 'px';
      d.style.top = ((e.y - e.r) * s) + 'px';
      d.style.width = ((e.x2 - e.x1) * s) + 'px';
      d.style.height = (2 * r) + 'px';
      // round dots on the same pitch the PDF draws its circles on
      d.style.backgroundImage = `radial-gradient(circle at 50% 50%, ${e.color} 46%, transparent 52%)`;
      d.style.backgroundSize = `${e.gap * s}px ${2 * r}px`;
      d.style.backgroundRepeat = 'repeat-x';
      layer.appendChild(d);
    } else if (e.k === 'rule') {
      const d = document.createElement('div');
      d.className = 'rule';
      d.style.left = (e.x1 * s) + 'px';
      d.style.top = ((e.y - (e.w || 0.6) / 2) * s) + 'px';
      d.style.width = ((e.x2 - e.x1) * s) + 'px';
      d.style.height = Math.max(1, (e.w || 0.6) * s) + 'px';
      d.style.background = e.color;
      layer.appendChild(d);
    }
  });

  // Index the nodes we just built by block id, so a drag can move one block's
  // pixels instead of re-laying-out the document. Only valid when the created
  // nodes are 1:1 with the display list; if they are not, dragging falls back
  // to a full relayout rather than moving the wrong thing.
  const kids = layer.children;
  if (kids.length === lay.displayList.length) {
    const byBlock = new Map();
    for (let i = 0; i < kids.length; i++) {
      const id = lay.displayList[i].id;
      if (id == null) continue;
      if (!byBlock.has(id)) byBlock.set(id, []);
      byBlock.get(id).push(kids[i]);
    }
    state.byBlock = byBlock;
  } else {
    state.byBlock = null;
  }

  requestAnimationFrame(measureWidths);
}

// Measured after layout settles: does the browser put each run at the width
// the PDF exporter assumed? This is the number that decides whether a line
// that fits on screen also fits on press.
function measureWidths() {
  if (!state.lay) return;
  const runs = state.lay.displayList.filter(e => e.k === 'text');
  if (!runs.length) return;

  // Measure at 1:1 in a detached layer, so the number reports the layout model
  // rather than how the artboard happens to be zoomed on screen.
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre;';
  const probes = runs.map(run => {
    const d = document.createElement('div');
    d.style.display = 'inline-block';
    applyTextStyle(d, run, 1);
    d.textContent = run.t;
    host.appendChild(d);
    return d;
  });
  document.body.appendChild(host);

  let maxDev = 0;
  runs.forEach((run, i) => {
    // Chrome adds one letter-space unit after the final glyph in its rect
    const cssW = probes[i].getBoundingClientRect().width - (run.tracking || 0);
    const pdfW = engine.wOf(run.t, {
      font: run.font, style: run.style, size: run.size, tracking: run.tracking || 0
    });
    maxDev = Math.max(maxDev, Math.abs(cssW - pdfW));
  });
  host.remove();

  state.widthDev = { maxDev, n: runs.length };
  drawFidelity();
}

function drawOverlays() {
  const s = state.zoomScale, wrap = document.getElementById('overlays');
  wrap.innerHTML = '';
  const byId = new Map();
  state.lay.bounds.forEach(b => {
    const d = document.createElement('div');
    d.className = 'bound' + (b.id === state.sel ? ' sel' : '');
    d.style.left = (b.x * s) + 'px';
    d.style.top = (b.y * s) + 'px';
    d.style.width = (b.w * s) + 'px';
    d.style.height = (Math.max(b.h, 10) * s) + 'px';
    d.dataset.id = b.id;
    d.addEventListener('pointerdown', onDragStart);
    wrap.appendChild(d);
    byId.set(b.id, d);
  });
  state.boundById = byId;
}

function drawList() {
  const list = document.getElementById('blockList');
  list.innerHTML = '';
  state.menu.blocks.forEach(b => {
    const btn = document.createElement('button');
    btn.className = (b.id === state.sel ? 'sel' : '');
    const label = b.name || b.text || b.type;
    btn.innerHTML = '<span class="tag">' + b.type + '</span><span>' +
      String(label).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + '</span>';
    btn.onclick = () => select(b.id);
    list.appendChild(btn);
  });
}

function drawFidelity() {
  const m = state.menu, lay = state.lay;
  const contentIn = lay.extent / PT;
  const slack = m.page.h - contentIn;
  const el = document.getElementById('fidelity');
  const dev = state.widthDev || { maxDev: 0, n: 0 };
  const runs = lay.displayList.filter(e => e.k === 'text').length;
  el.innerHTML =
    'Page <b>' + m.page.w + ' × ' + m.page.h + ' in</b> (' +
    Math.round(m.page.w * 25.4) + ' × ' + Math.round(m.page.h * 25.4) + ' mm)<br>' +
    'Live area ends at <b>' + contentIn.toFixed(2) + ' in</b><br>' +
    (slack < 0
      ? '<span class="warn">Overflow by ' + (-slack).toFixed(2) + ' in</span>'
      : 'Bottom margin <b>' + slack.toFixed(2) + ' in</b>') +
    '<br><br>' + runs + ' text runs, ' +
    lay.displayList.filter(e => e.k === 'dots').length + ' leader runs<br>' +
    'Screen ↔ PDF width agreement: <b>' +
    (dev.maxDev < 0.05 ? 'exact' : dev.maxDev.toFixed(2) + ' pt') + '</b>' +
    ' (max over ' + dev.n + ' runs)<br>' +
    '<span class="hint">Screen and PDF are drawn from the same display list; ' +
    'the browser is never allowed to wrap text.</span>';
  document.getElementById('fit').textContent = '';
}

// ---- interaction ---------------------------------------------------------
function onDragStart(ev) {
  ev.preventDefault();
  const id = ev.currentTarget.dataset.id;
  select(id);
  const s = state.zoomScale;
  const b = state.menu.blocks.find(x => x.id === id);
  const start = { px: ev.clientX, py: ev.clientY, x: b.x, y: b.y };

  // A drag is a transform per frame, not a re-layout per frame. The engine is
  // asked to lay the document out exactly once, on release.
  const nodes = state.byBlock ? (state.byBlock.get(id) || []) : null;
  const bound = state.boundById ? state.boundById.get(id) : ev.currentTarget;
  let dx = 0, dy = 0, ticking = false;

  const paint = () => {
    const t = 'translate(' + dx + 'px,' + dy + 'px)';
    if (nodes) nodes.forEach(n => { n.style.transform = t; });
    if (bound) bound.style.transform = t;
  };

  const move = e => {
    dx = e.clientX - start.px;
    dy = e.clientY - start.py;
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(() => { ticking = false; paint(); });
    }
  };

  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (bound) bound.style.transform = '';
    if (!nodes) {                       // no node index: fall back to a full relayout
      b.x = +(start.x + dx / (s * PT)).toFixed(3);
      b.y = +(start.y + dy / (s * PT)).toFixed(3);
      relayout();
      return;
    }
    nodes.forEach(n => { n.style.transform = ''; });
    const nx = +(start.x + dx / (s * PT)).toFixed(3);
    const ny = +(start.y + dy / (s * PT)).toFixed(3);
    if (nx !== start.x || ny !== start.y) {
      b.x = nx; b.y = ny;
      relayout();                       // one relayout, on release
    }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function select(id) {
  state.sel = id;
  drawOverlays();
  drawList();
  drawInspector();
}

function drawInspector() {
  const box = document.getElementById('inspector');
  const b = state.menu.blocks.find(x => x.id === state.sel);
  box.innerHTML = '<h2>Inspector</h2>';
  if (!b) {
    box.insertAdjacentHTML('beforeend', '<div class="hint">Select a block on the page.</div>');
    return;
  }
  const field = (label, node) => {
    const row = document.createElement('div');
    row.className = 'row';
    const l = document.createElement('label');
    l.textContent = label;
    row.appendChild(l);
    row.appendChild(node);
    box.appendChild(row);
    return node;
  };
  const mk = (type, val, onIn) => {
    const el = document.createElement('input');
    el.type = type;
    el.value = val;
    el.addEventListener('input', () => onIn(el.value));
    return el;
  };

  box.insertAdjacentHTML('beforeend', '<div class="hint" style="margin-bottom:9px">' + b.type + ' · ' + b.id + '</div>');

  if (b.type === 'item') {
    field('Name', mk('text', b.name, v => { b.name = v; relayout(); }));
    const ta = document.createElement('textarea');
    ta.value = b.desc || '';
    ta.addEventListener('input', () => { b.desc = ta.value; relayout(); });
    box.appendChild(ta);
    field('Price', mk('text', b.price, v => { b.price = v; relayout(); }));
    field('Tags', mk('text', (b.tags || []).join(', '), v => {
      b.tags = v.split(',').map(t => t.trim()).filter(Boolean);
      relayout();
    }));
  } else if (b.type !== 'rule') {
    const ta = document.createElement('textarea');
    ta.value = b.text || '';
    ta.addEventListener('input', () => { b.text = ta.value; relayout(); });
    box.appendChild(ta);
  }

  field('Size', mk('number', b.size || 0, v => { b.size = +v; relayout(); }));
  const sel = document.createElement('select');
  ['left', 'center', 'right'].forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    if ((b.align || 'left') === a) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { b.align = sel.value; relayout(); };
  field('Align', sel);
  field('Color', mk('color', b.color || state.menu.theme.ink, v => { b.color = v; relayout(); }));
  field('X (in)', mk('number', b.x.toFixed(2), v => { b.x = +v; relayout(); }));
  field('Y (in)', mk('number', b.y.toFixed(2), v => { b.y = +v; relayout(); }));
  field('W (in)', mk('number', b.w.toFixed(2), v => { b.w = +v; relayout(); }));
}

function zoomPercentLabel() {
  document.getElementById('zoomLabel').textContent = Math.round(state.zoomScale * 100) + '%';
}

function fitZoom() {
  const m = state.menu, main = document.querySelector('main');
  const availW = main.clientWidth - 56, availH = main.clientHeight - 56;
  const bleed = (m.page.bleed || 0);
  const wPt = (m.page.w + bleed * 2) * PT;
  const hPt = (m.page.h + bleed * 2) * PT;
  state.zoomScale = Math.max(0.1, Math.min(availW / wPt, availH / hPt));
  state.zoom = state.zoomScale;
  zoomPercentLabel();
}

function applyZoom(z) {
  state.zoomScale = Math.max(0.15, Math.min(3, z));
  zoomPercentLabel();
  drawSheet(); drawOverlays();
}

// ---- page controls -------------------------------------------------------
const IN_MM = 25.4;
function bindPage() {
  const m = state.menu;
  const sync = () => {
    document.getElementById('pwIn').value = m.page.w.toFixed(2);
    document.getElementById('phIn').value = m.page.h.toFixed(2);
    document.getElementById('pwMm').value = Math.round(m.page.w * IN_MM);
    document.getElementById('phMm').value = Math.round(m.page.h * IN_MM);
    document.getElementById('bleedIn').value = (m.page.bleed || 0);
    document.getElementById('cropMarks').checked = !!m.page.cropMarks;
    document.getElementById('paper').value = m.theme.paper;
    document.getElementById('ink').value = m.theme.ink;
    document.getElementById('accentColor').value = m.theme.accent;
  };
  const setW = v => { if (v > 1 && v < 40) { m.page.w = +v; sync(); fitZoom(); relayout(); } };
  const setH = v => { if (v > 1 && v < 40) { m.page.h = +v; sync(); fitZoom(); relayout(); } };
  document.getElementById('pwIn').oninput = e => setW(+e.target.value);
  document.getElementById('phIn').oninput = e => setH(+e.target.value);
  document.getElementById('pwMm').oninput = e => setW(+e.target.value / IN_MM);
  document.getElementById('phMm').oninput = e => setH(+e.target.value / IN_MM);
  document.getElementById('bleedIn').oninput = e => {
    m.page.bleed = Math.max(0, Math.min(0.5, +e.target.value)); relayout();
  };
  document.getElementById('cropMarks').onchange = e => { m.page.cropMarks = e.target.checked; relayout(); };
  document.getElementById('paper').oninput = e => { m.theme.paper = e.target.value; relayout(); };
  document.getElementById('ink').oninput = e => { m.theme.ink = e.target.value; relayout(); };
  document.getElementById('accentColor').oninput = e => { m.theme.accent = e.target.value; relayout(); };
  sync();
}

const PRESETS = {
  letter: [8.5, 11],
  a4: [210 / IN_MM, 297 / IN_MM],
  half: [5.5, 8.5],
  dl: [3.7, 8.5]
};
document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.onclick = () => {
    const [w, h] = PRESETS[btn.dataset.preset];
    state.menu.page.w = +w.toFixed(4);
    state.menu.page.h = +h.toFixed(4);
    bindPage(); fitZoom(); relayout();
  };
});

document.getElementById('zoomIn').onclick = () => applyZoom(state.zoomScale * 1.15);
document.getElementById('zoomOut').onclick = () => applyZoom(state.zoomScale / 1.15);
window.addEventListener('resize', () => { fitZoom(); drawSheet(); drawOverlays(); });

document.addEventListener('keydown', e => {
  const b = state.menu && state.menu.blocks.find(x => x.id === state.sel);
  if (!b || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const step = (e.shiftKey ? 10 : 1) / PT;
  if (e.key === 'ArrowUp') { b.y -= step; requestRelayout(); e.preventDefault(); }
  if (e.key === 'ArrowDown') { b.y += step; requestRelayout(); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { b.x -= step; requestRelayout(); e.preventDefault(); }
  if (e.key === 'ArrowRight') { b.x += step; requestRelayout(); e.preventDefault(); }
});

// ---- pages ---------------------------------------------------------------
// The planner measures with the same engine the builder renders with, so a
// planned page and a rendered page are the same page.
function measureFn(text, role, size) {
  const family = (state.menu.theme.fonts && state.menu.theme.fonts.body ?
    state.menu.theme.fonts.body.family : 'MLato');
  return engine.wOf(text, { font: family, style: 'normal', size: size || 10, tracking: 0 });
}

function blockHeightFn(section, width, pattern, ts) {
  const th = state.menu.theme;
  const box = b => Object.assign({ x: 0, y: 0, w: width }, b);
  let h = engine.layoutBlock(box({
    type: 'section', text: section.title, size: 8.2 * ts, tracking: 2.2
  }), th).h / 72 + 0.10 * ts;
  (section.items || []).forEach(it => {
    h += engine.layoutBlock(box({
      type: 'item', name: it.name, desc: it.desc || '', price: it.price,
      tags: it.tags || [], size: 12.4 * ts, descSize: 8.2 * ts
    }), th).h / 72 + 0.15 * ts;
  });
  return h + 0.16 * ts;
}

function planAndBuild(parsed) {
  // adopt the reference's sheet size before planning, so columns are measured
  // against the page they will actually be printed on
  if (designRef && designRef.pageSize) {
    state.menu.page.w = designRef.pageSize.w;
    state.menu.page.h = designRef.pageSize.h;
    bindPage();
  }
  const page = state.menu.page;
  // the masthead occupies real height; the planner has to start columns below it
  const masthead = parsed.title ? 1.85 : (parsed.subtitle ? 0.9 : 0);
  const plan = MenuPlanner.plan({
    parsed: parsed,
    page: page,
    reference: designRef && designRef.columns ? { columns: designRef.columns } : null,
    top: 0.55,
    mastheadIn: masthead,
    bottom: page.h - 0.8,
    measure: measureFn,
    blockHeight: blockHeightFn
  });
  const menus = MenuModel.buildPagesFromParsed(engine, parsed, {
    page: page, theme: state.menu.theme, plan: plan,
    top: 1.05, bottom: page.h - 0.8
  });
  state.pages = menus;
  state.pageIndex = 0;
  state.menu = menus[0];
  state.sel = null;
  drawPageNav();
  relayout();
  return { plan: plan, menus: menus };
}

function drawPageNav() {
  let nav = document.getElementById('pageNav');
  if (!nav) {
    nav = document.createElement('div');
    nav.id = 'pageNav';
    nav.style.cssText = 'display:flex;gap:6px;align-items:center;margin-left:8px';
    const anchor = document.getElementById('export');
    anchor.parentNode.insertBefore(nav, anchor);
  }
  const n = state.pages ? state.pages.length : 1;
  if (n <= 1) { nav.innerHTML = ''; return; }
  nav.innerHTML = '<button class="btn" id="pgPrev">‹</button>' +
    '<span class="hint">page ' + (state.pageIndex + 1) + ' / ' + n + '</span>' +
    '<button class="btn" id="pgNext">›</button>';
  document.getElementById('pgPrev').onclick = () => showPage(state.pageIndex - 1);
  document.getElementById('pgNext').onclick = () => showPage(state.pageIndex + 1);
}

function showPage(i) {
  if (!state.pages || !state.pages.length) return;
  const next = Math.max(0, Math.min(state.pages.length - 1, i));
  state.pageIndex = next;
  state.menu = state.pages[next];
  state.sel = null;
  drawPageNav();
  relayout();
}

// ---- export --------------------------------------------------------------
document.getElementById('export').onclick = () => {
  const menus = (state.pages && state.pages.length) ? state.pages : [state.menu];
  const lays = menus.map(m => (m === state.menu && state.lay) ? state.lay : engine.layout(m));
  const pdf = MenuPDF.renderPDFPages(jspdf.jsPDF, menus, lays, fontDefs);
  pdf.save(menus.length > 1 ? 'menu-' + menus.length + 'pp.pdf' : 'menu.pdf');
  document.getElementById('status').textContent =
    'exported ' + menus.length + ' page' + (menus.length > 1 ? 's' : '') +
    ' · ' + new Date().toLocaleTimeString();
};

// ---- file import: PDF for copy, PNG for design ---------------------------
pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';

let designRef = null;

document.getElementById('importFile').onchange = async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  document.getElementById('importFileName').textContent = file.name;
  const panel = document.getElementById('designPanel');
  try {
    if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
      await importPdf(file);
    } else {
      await importImage(file);
    }
  } catch (err) {
    panel.innerHTML = '<div class="warnline error">Could not read that file: ' +
      (err && err.message ? err.message : err) + '</div>';
  }
};

// PDFs carry real text with real coordinates, so the copy can be lifted
// exactly — no OCR, no guessing. The words still have to be put back into
// columns and lines, which is what MenuLayout does.
async function importPdf(file) {
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const words = [];
  const pageHeight = [];
  let firstW = 0, firstH = 0;
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    if (p === 1) { firstW = vp.width; firstH = vp.height; }
    pageHeight.push(vp.height);
    const tc = await page.getTextContent();
    const offset = (p - 1) * 1e5;
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const h = it.height || Math.abs(it.transform[3]) || 10;
      const yTop = vp.height - it.transform[5] - h + offset;
      // tracked type arrives with spaces between the letters; collapse inside the
      // item so the item boundary stays a real word boundary
      const tracked = MenuLayout.collapseTracked(it.str);
      if (tracked) {
        words.push({ text: tracked, x: it.transform[4], y: yTop,
                     w: Math.max(1, it.width || h * tracked.length * 0.5), h });
        return;
      }
      const parts = it.str.split(/\s+/).filter(Boolean);
      const total = it.str.length || 1;
      let cursor = 0;
      parts.forEach(word => {
        const idx = it.str.indexOf(word, cursor);
        const lead = idx < 0 ? cursor : idx;
        const x = it.transform[4] + (lead / total) * (it.width || 0);
        const w = Math.max(1, (word.length / total) * (it.width || h * word.length * 0.5));
        words.push({ text: word, x, y: yTop, w, h });
        cursor = lead + word.length;
      });
    });
  }

  const laid = MenuLayout.reconstruct(words);
  pending = MenuImport.parse(laid.text);
  designRef = designRef || {};
  designRef.columns = laid.columns;      // the reference's grid, for the planner
  // the reference's sheet size too — an A4 menu laid out on Letter is already wrong
  designRef.pageSize = { w: +(firstW / PT).toFixed(2), h: +(firstH / PT).toFixed(2) };
  renderPreview();

  const panel = document.getElementById('designPanel');
  panel.innerHTML = '<h4>Read from PDF</h4><div class="hint">' +
    words.length + ' words · ' + laid.stats.lines + ' lines · ' +
    laid.stats.columns + ' column(s) detected · ' + doc.numPages + ' page(s). ' +
    'Prices and descriptions are rebuilt from their positions.</div>';
}

// Images give the design, not the copy: measured OCR on real menus lands at
// 47-67% confidence and garbles names, so text from a photo is not offered.
async function importImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bmp.width * scale));
  canvas.height = Math.max(1, Math.round(bmp.height * scale));
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const read = MenuDesign.analyse(canvas.width, canvas.height, img.data, { channels: 4 });
  designRef = { read: read, url: URL.createObjectURL(file) };
  renderDesignPanel();
  await tryOcr(file);
}

// Browsers have no decent OCR engine, so the copy comes from a local sidecar
// (ocr/server.py) that returns word boxes. Same reconstruction path as the PDF.
const OCR_SERVICE = 'http://127.0.0.1:8792';

async function tryOcr(file) {
  const panel = document.getElementById('designPanel');
  const note = document.createElement('div');
  note.className = 'warnline info';
  note.textContent = 'Reading the text with the local OCR engine…';
  panel.appendChild(note);

  let words = null;
  try {
    const res = await fetch(OCR_SERVICE + '/ocr', { method: 'POST', body: file });
    if (!res.ok) throw new Error('OCR service returned ' + res.status);
    const data = await res.json();
    words = data.words;
  } catch (err) {
    note.className = 'warnline';
    note.textContent = 'No OCR service on ' + OCR_SERVICE + ' — design read only. ' +
      'Start it with: .ocr/bin/python ocr/server.py';
    return;
  }
  note.remove();

  if (!words || !words.length) {
    panel.insertAdjacentHTML('beforeend',
      '<div class="warnline">The OCR engine found no text in that image.</div>');
    return;
  }

  const laid = MenuLayout.reconstruct(words);
  pending = MenuImport.parse(laid.text);
  if (designRef) designRef.columns = laid.columns;   // grid comes from the boxes
  renderPreview();

  panel.insertAdjacentHTML('beforeend',
    '<div class="hint">OCR found ' + words.length + ' lines · ' + laid.stats.columns +
    ' column(s) · mean confidence ' +
    Math.round(100 * words.reduce((a, w) => a + (w.conf || 0), 0) / words.length) +
    '%. Check the prices below — OCR misreads digits more often than words.</div>');
}

function renderDesignPanel() {
  const panel = document.getElementById('designPanel');
  if (!designRef) return;
  const read = designRef.read;
  const t = MenuDesign.toTheme(read);
  const pct = v => Math.round(v * 100) + '%';
  const swatch = c => '<span style="display:inline-block;width:15px;height:15px;border-radius:3px;' +
    'margin-right:5px;border:1px solid #0004;background:' + c + '"></span>';

  panel.innerHTML =
    '<h4>Design read</h4>' +
    '<div class="hint">' + read.px.w + '×' + read.px.h + ' px · aspect ' + read.aspect +
      ' · ' + (read.hasArtworkBorder ? 'artwork runs to the edge' : 'plain edge') + '</div>' +
    '<div class="summary">Page <b>' + read.page.name + '</b> — ' + read.page.w + '×' + read.page.h + ' in</div>' +
    '<div class="row"><label>Swatches</label><span style="font-size:10px;color:var(--dim)">' +
      swatch(t.palette.paper) + t.palette.paper + ' ' +
      swatch(t.palette.ink) + t.palette.ink + ' ' +
      swatch(t.palette.accent) + t.palette.accent +
      (read.accents.length > 1 ? ' ' + read.accents.slice(1).map(swatch).join('') : '') +
    '</span></div>' +
    '<div class="row"><label>Margins</label><span class="hint">l ' + pct(read.margins.left) +
      ' · r ' + pct(read.margins.right) + ' · t ' + pct(read.margins.top) +
      ' · b ' + pct(read.margins.bottom) + '</span></div>' +
    '<div class="row"><label>Ink coverage</label><span class="hint">' +
      (read.inkCoverage * 100).toFixed(1) + '%</span></div>' +
    '<div class="row"><button class="btn" id="designApply">Use as theme</button>' +
      '<button class="btn" id="designRefBtn">Underlay</button></div>' +
    '<div class="warnline info">Copy from a photo needs OCR, which measured 47–67% confidence ' +
      'on real menus and garbled dish names — so this reads the design only. Upload a PDF ' +
      'for the text.</div>';

  document.getElementById('designApply').onclick = () => applyDesign(t);
  document.getElementById('designRefBtn').onclick = () => {
    const img = document.getElementById('refImg');
    img.src = designRef.url;
    img.style.display = '';
    document.getElementById('status').textContent = 'reference underlay on';
  };
}

function applyDesign(t) {
  Object.assign(state.menu.theme, t.palette);
  state.menu.page.w = t.page.w;
  state.menu.page.h = t.page.h;
  if (pending && pending.stats.items) {
    planAndBuild(pending);
  }
  bindPage();
  fitZoom();
  relayout();
  document.getElementById('status').textContent = 'theme from image · ' + t.page.name;
}

// ---- boot ----------------------------------------------------------------
(async function boot() {
  try {
    fontDefs = await loadFonts();
    engine = buildMetrics(fontDefs);
    // fonts.ready can sit pending forever if one font request stalls; the app
    // is usable with system fallbacks, so don't make boot hostage to it
    await Promise.race([
      document.fonts.ready,
      new Promise(r => setTimeout(r, 1500))
    ]);
    state.menu = MenuModel.buildMenu(engine);
    bindPage();            // page size, bleed, paper/ink/accent fields reflect the model
    fitZoom();
    relayout();
    document.getElementById('status').textContent = 'ready · ' + state.menu.blocks.length + ' blocks';
    window.__state = state;   // for the screenshot harness
  } catch (err) {
    document.getElementById('status').textContent = 'ERR: ' + err.message;
    console.error(err);
    window.__bootError = String(err && err.stack || err);
  }
})();
</script>
<script>
/* Canvas mode wiring — deliberately outside the model editor's script.
   "Keep layout" sends the PDF to the local sidecar (sidecar/lines_server.py),
   gets back line objects with the page's own glyph positions, and opens the
   overlay. Nothing here touches the model, the engine or the exporter. */
(function () {
  const SERVICE = window.LINES_SERVICE || 'http://127.0.0.1:8793';
  const btn = document.getElementById('canvasBtn');
  const file = document.getElementById('canvasFile');
  if (!btn || !file) return;

  function say(msg) {
    const el = document.getElementById('status');
    if (el) el.textContent = msg;
  }

  async function sidecar() {
    try {
      const res = await fetch(SERVICE + '/health', { cache: 'no-store' });
      return res.ok;
    } catch (e) { return false; }
  }

  function toBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  btn.addEventListener('click', async () => {
    if (!(await sidecar())) {
      say('Canvas mode needs the line sidecar: .lines/bin/python sidecar/lines_server.py');
      return;
    }
    // The workspace first: a client who already has a menu should land on their
    // menu, not on a file dialog.
    MenuCanvas.openWorkspace({ onClose: () => say('menu closed — reopen from Keep layout') });
  });

  file.addEventListener('change', async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    file.value = '';
    say('reading ' + f.name + '…');
    try {
      const buf = await f.arrayBuffer();
      const res = await fetch(SERVICE + '/lines', {
        method: 'POST',
        headers: { 'Content-Type': 'application/pdf' },
        body: buf
      });
      if (!res.ok) {
        say('canvas import failed: ' + (await res.text()).slice(0, 140));
        return;
      }
      const data = await res.json();
      MenuCanvas.open({ data: data, pdfBase64: toBase64(buf) });
      const n = data.pages.reduce((a, p) => a + p.objects.length, 0);
      say('canvas: ' + n + ' editable lines on ' + data.pages.length +
          (data.pages.length === 1 ? ' page' : ' pages'));
    } catch (err) {
      say('canvas import failed: ' + err.message);
    }
  });
})();
</script>
